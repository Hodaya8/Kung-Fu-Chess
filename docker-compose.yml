version: '3.8'

services:
  db:
    image: postgres:15
    container_name: kungfu_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: kungfu_chess
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: kungfu_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    
  server:
    build: .
    container_name: kungfu_server
    ports:
      - "9002:9002"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=secretpassword
      - DB_NAME=kungfu_chess
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
    restart: unless-stopped
  api_gateway:
    build: ./API_GATEWAY
    container_name: kungfu_api_gateway
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped